name: fetch-overseas-feeds

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 抓取失败（个别源 404/超时）不让整个 job 变红
      - name: Fetch feeds
        continue-on-error: true
        run: python fetch_feeds.py

      - name: Show result
        if: always()
        run: |
          if [ -f data/latest.json ]; then
            python -c 'import json;d=json.load(open("data/latest.json",encoding="utf-8"));e=d.get("errors") or [];print("count=",d.get("count"),"fresh=",d.get("fresh"),"ok_sources=",d.get("ok_sources"),"errors=",len(e));print("\n".join(e[:10]))'
          else
            echo "no data/latest.json"
          fi

      - name: Commit if changed
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add -A data/latest.json || true
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: update feeds $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
